# Keep alphabetical and formatted correctly please
[versions]
gradle-ktlint                   = "14.2.0"
kotest                          = "6.2.7"
kotlin                          = "2.4.21"
kover                           = "0.9.11"

[libraries]
# Test
kotest-assertions-core          = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner-junit6            = { module = "io.kotest:kotest-runner-junit6", version.ref = "kotest" }

[bundles]
kotest                          = ["kotest-assertions-core", "kotest-runner-junit6"]

[plugins]
gradle-ktlint                   = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "gradle-ktlint" }
kotest-gradle-plugin            = { id = "io.kotest", version.ref = "kotest" }
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover                           = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
